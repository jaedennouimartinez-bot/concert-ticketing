  </head><body class="bg-on-background/65 backdrop-blur-sm min-h-screen w-full flex flex-col justify-center items-center font-body-lg text-on-surface p-margin"><main class="flex flex-col relative w-full max-w-[390px] items-center justify-center pt-safe pb-safe"><div class="flex flex-col w-full relative">
<!-- Dimmed Modal Scrim / Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-gutter bg-inverse-surface/65 backdrop-blur-sm transition-opacity duration-200" id="modal-backdrop">
<!-- Modal Dialog Card -->
<div class="w-full max-w-[340px] bg-surface-container-lowest rounded-xl shadow-2xl p-space-lg flex flex-col items-center text-center transition-all duration-200 transform scale-100" id="modal-card">
<!-- Status Icon Badge (Sold Out / Unavailable) -->
<div class="w-14 h-14 rounded-full bg-error-container text-on-error-container flex items-center justify-center mb-space-md shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">
          confirmation_number
        </span>
</div>
<!-- Dialog Headline -->
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-space-xs tracking-tight">
        Sold Out
      </h2>
<!-- Dialog Explanation Body -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-space-lg">
        This event has reached capacity.
      </p>
<!-- Event Context Micro-Card -->
<div class="w-full bg-surface-container-low rounded-lg p-space-sm mb-space-lg flex items-center gap-space-sm text-left">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="Vibrant live music stage with deep blue and amber neon spotlights illuminating a cheering audience silhouette at night" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBigFrJlVuWV4Mhi0ObQEWEWiE64obQdcVtp0CowdD_hak_SzhybA28CALHG7-fv2RsFZqFp5566KJtw7t3msWX-WvKIt267vlbQlXW44sQl-NB-XrvnXS3pV-uENs4UFHabDObXSsySW8gdGBk2a3tu8V4nhghs6O0N_LjTiOc_PmvThhQ2cXgDJNqPZcC64Z0xD9NaIePcZIelwnsudzVBz8n4Uxu4eErdsz4_A"/>
</div>
<div class="flex flex-col min-w-0 flex-1">
<span class="font-label-sm text-label-sm text-on-surface truncate">Neon Horizon Tour</span>
<span class="font-label-sm text-label-sm text-outline truncate">Main Stage • 8:00 PM</span>
</div>
<span class="font-label-sm text-label-sm px-2 py-0.5 rounded-full bg-surface-container-highest text-on-surface-variant">
          0 Left
        </span>
</div>
<!-- Primary Action CTA Button -->
<button class="w-full h-12 min-h-[48px] bg-primary-container text-on-primary font-body-lg-bold text-body-lg-bold rounded-xl shadow-sm flex items-center justify-center active:scale-[0.99] transition-all hover:opacity-95 focus:outline-none" id="dismiss-btn" type="button">
        OK
      </button>
<!-- Subdued Secondary Action (Join Waitlist link) -->
<button class="mt-space-sm text-primary font-label-md text-label-md py-1 px-3 rounded-full hover:bg-surface-container transition-colors" id="waitlist-btn" type="button">
        Notify if tickets release
      </button>
</div>
</div>
</div>
<script>
  (function() {
    const backdrop = document.getElementById('modal-backdrop');
    const card = document.getElementById('modal-card');
    const dismissBtn = document.getElementById('dismiss-btn');
    const waitlistBtn = document.getElementById('waitlist-btn');

    function closeModal() {
      if (!backdrop || !card) return;
      card.classList.add('scale-95', 'opacity-0');
      backdrop.classList.add('opacity-0');
      setTimeout(() => {
        backdrop.style.display = 'none';
      }, 200);
    }

    if (dismissBtn) {
      dismissBtn.addEventListener('click', closeModal);
    }

    if (waitlistBtn) {
      waitlistBtn.addEventListener('click', function() {
        waitlistBtn.textContent = 'Added to Waitlist ✓';
        waitlistBtn.classList.replace('text-primary', 'text-secondary');
        setTimeout(closeModal, 600);
      });
    }

    if (backdrop) {
      backdrop.addEventListener('click', function(e) {
        if (e.target === backdrop) {
          closeModal();
        }
      });
    }
  })();
</script></main></body></html>
