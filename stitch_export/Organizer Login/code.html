<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-xl p-8 sm:p-10 flex flex-col relative overflow-hidden">
<div class="absolute -top-20 -right-20 w-44 h-44 rounded-full bg-primary-fixed/30 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-24 -left-20 w-44 h-44 rounded-full bg-secondary-fixed/20 blur-2xl pointer-events-none"></div>
<div class="relative flex flex-col items-center text-center">
<div class="w-14 h-14 rounded-xl bg-primary-container flex items-center justify-center text-on-primary shadow-md mb-4 transition-transform hover:scale-105 duration-200">
<span class="material-symbols-outlined text-[30px]" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
</div>
<span class="font-label-sm text-label-sm uppercase text-primary tracking-wider mb-2 font-semibold">
        Concert Ticketing • Organizer Access
      </span>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 font-bold">
        Organizer Login
      </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mb-8">
        Sign in to manage venue box office, attendees, and ticketing capacity.
      </p>
</div>
<form class="relative flex flex-col gap-5 w-full" id="organizer-login-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="organizer-email">
          Email Address
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            mail
          </span>
<input autocomplete="email" class="w-full h-12 pl-11 pr-4 rounded-lg bg-surface-container-lowest text-on-surface font-body-lg text-body-lg placeholder:text-outline/70 focus:outline-none focus:ring-2 focus:ring-primary-container transition-all shadow-sm" id="organizer-email" name="email" placeholder="organizer@venue.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="organizer-password">
            Password
          </label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            lock
          </span>
<input autocomplete="current-password" class="w-full h-12 pl-11 pr-12 rounded-lg bg-surface-container-lowest text-on-surface font-body-lg text-body-lg placeholder:text-outline/70 focus:outline-none focus:ring-2 focus:ring-primary-container transition-all shadow-sm" id="organizer-password" name="password" placeholder="Enter your security passkey" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2 p-2 text-outline hover:text-on-surface transition-colors rounded-lg flex items-center justify-center cursor-pointer" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">
              visibility
            </span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none group">
<input class="w-4 h-4 rounded text-primary-container accent-primary-container focus:ring-primary-container cursor-pointer" id="remember-me" type="checkbox"/>
<span class="font-body-lg text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">
            Remember me
          </span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container font-semibold transition-colors" href="#forgot-credentials">
          Forgot password?
        </a>
</div>
<button class="w-full h-12 mt-2 bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary font-body-lg-bold text-body-lg-bold rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer" id="login-submit-button" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="w-full bg-surface-container rounded-lg p-3 mt-1 flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-secondary text-[18px]" style="font-variation-settings: 'FILL' 1;">
          verified_user
        </span>
<span class="font-label-sm text-label-sm text-center">
          256-bit encrypted venue management session
        </span>
</div>
</form>
</div>
<div class="mt-6 flex items-center justify-center gap-4 text-on-surface-variant">
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-sm text-label-sm">Gateway Online</span>
</div>
<span class="text-outline-variant">•</span>
<span class="font-label-sm text-label-sm">Venue Console v4.8</span>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('organizer-password');
    const toggleButton = document.getElementById('toggle-password-btn');
    const toggleIcon = document.getElementById('password-toggle-icon');

    if (toggleButton && passwordInput && toggleIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
