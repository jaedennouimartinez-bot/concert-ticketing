  </head><body class="bg-on-background/65 backdrop-blur-sm min-h-screen w-full flex flex-col justify-center items-center font-body-lg text-on-surface p-margin"><main class="flex flex-col relative w-full max-w-[390px] items-center justify-center pt-safe pb-safe"><div class="flex flex-col w-full relative items-center justify-center py-space-xl">
<!-- Subtle underlying concert checkout summary for context depth -->
<div aria-hidden="true" class="w-full space-y-space-md opacity-25 pointer-events-none select-none">
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm">
<div class="flex items-center justify-between mb-space-sm">
<span class="font-label-sm text-label-sm text-primary">STAGEFRONT VIP PASS</span>
<span class="font-label-sm text-label-sm text-secondary">TIER 1</span>
</div>
<div class="font-headline-sm text-headline-sm text-on-surface">The Midnight Echoes</div>
<div class="font-body-lg text-body-lg text-on-surface-variant">Gate B • Row 04 • Seat 12</div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm space-y-space-sm">
<div class="h-12 bg-surface-container rounded-lg"></div>
<div class="h-12 bg-surface-container rounded-lg"></div>
</div>
</div>
<!-- Dimmed Scrim / Backdrop Overlay -->
<div class="fixed inset-0 bg-inverse-surface/60 backdrop-blur-sm z-40 transition-opacity duration-300 flex items-center justify-center p-margin" id="modal-scrim">
<!-- Centered Modal Dialog Card -->
<div aria-describedby="dialog-desc" aria-labelledby="dialog-title" aria-modal="true" class="bg-surface-container-lowest text-on-surface rounded-xl p-space-lg w-full max-w-[340px] mx-auto text-center shadow-xl transform transition-all duration-300 scale-100 relative z-50" id="modal-card" role="dialog">
<!-- Top Status Badge Icon -->
<div class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center mx-auto mb-space-md text-primary-container shadow-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">
          assignment_late
        </span>
</div>
<!-- Bold Dialog Title -->
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs" id="dialog-title">
        Missing Information
      </h2>
<!-- One-line Clear Operational Notice -->
<p class="font-body-lg text-body-lg text-on-surface-variant mb-space-lg" id="dialog-desc">
        Please complete all required fields.
      </p>
<!-- Primary Action CTA Button -->
<button class="h-12 min-h-[48px] w-full rounded-xl bg-primary-container text-on-primary font-body-lg-bold text-body-lg-bold shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center cursor-pointer focus:outline-none" id="modal-dismiss-btn" type="button">
        OK
      </button>
<!-- Micro-interaction feedback indicator -->
<div class="mt-space-sm flex items-center justify-center gap-1.5 opacity-60">
<span class="material-symbols-outlined text-[14px] text-outline">verified_user</span>
<span class="font-label-sm text-label-sm text-outline">SECURE CHECKOUT</span>
</div>
</div>
</div>
<script>
    (() => {
      const dismissBtn = document.getElementById('modal-dismiss-btn');
      const scrim = document.getElementById('modal-scrim');
      const card = document.getElementById('modal-card');

      const handleDismiss = () => {
        if (!scrim || !card) return;
        card.classList.add('scale-95', 'opacity-0');
        scrim.classList.add('opacity-0', 'pointer-events-none');
        setTimeout(() => {
          scrim.classList.remove('opacity-0', 'pointer-events-none');
          card.classList.remove('scale-95', 'opacity-0');
        }, 1200);
      };

      if (dismissBtn) {
        dismissBtn.addEventListener('click', handleDismiss);
      }
      if (scrim) {
        scrim.addEventListener('click', (e) => {
          if (e.target === scrim) handleDismiss();
        });
      }
    })();
  </script>
</div></main></body></html>
